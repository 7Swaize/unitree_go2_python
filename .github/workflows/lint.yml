name: Lint

on:
  push:
    branches:
      - '**'

jobs:
  mypy:
    runs-on: ubuntu-22.04
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
 
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
 
      - name: Install dependencies
        run: |
          pip install mypy
          pip install -r requirements/runtime.in
 
      - name: Run mypy
        run: >
          mypy go2/
          --strict
          --check-untyped-defs
          --disable-error-code=unused-ignore
 
